[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcensus-mcp"
version = "0.1.0"
description = "Bounded local MCP stdio gateway for dated LinkCensus candidates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["linkcensus-client==0.1.0", "mcp==2.3.0"]

[project.urls]
Homepage = "https://linkcensus.com"
Documentation = "https://linkcensus.com/docs/mcp"

Source = "https://github.com/pucilpet/linkcensus-agent-clients"
Issues = "https://github.com/pucilpet/linkcensus-agent-clients/issues"

[project.scripts]
linkcensus-mcp = "linkcensus_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
