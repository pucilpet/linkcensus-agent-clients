[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcensus-client"
version = "0.1.0"
description = "Bounded REST client and CLI for dated LinkCensus candidate neighborhoods"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://linkcensus.com"
Documentation = "https://linkcensus.com/docs/api"

Source = "https://github.com/pucilpet/linkcensus-agent-clients"
Issues = "https://github.com/pucilpet/linkcensus-agent-clients/issues"

[project.scripts]
linkcensus = "linkcensus_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
